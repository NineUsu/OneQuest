# อัปเดตข้อมูลทุกวันแล้วเผยแพร่หน้าเว็บผ่าน GitHub Pages
# เปิดใช้: Settings > Pages > Source เลือก "GitHub Actions"
name: daily-update
on:
  schedule:
    - cron: "0 23 * * *"   # 06:00 เวลาไทย
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/build_data.py --live
      - name: Commit data.json
        run: |
          git config user.name "onequest-bot"
          git config user.email "onequest-bot@users.noreply.github.com"
          git add web/data.json
          git commit -m "data: daily update $(date -u +%F)" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
